<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="stylesheet" th:href="@{/css/style.css"}>
</head>
<body>
  <main>
    <h1>Candidatos</h1>

    <form method="get" th:action="@{/}" class="filtros">
      <label for="cargo">Cargo</label>
      <select id="cargo" name="cargo">
        <option value="">Todos os cargos</option>
        <option th:each="opcaoCargo : ${cargos}"
                th:value="${opcaoCargo}"
                th:text="${opcaoCargo}"
                th:selected="${opcaoCargo == cargoSelecionado}"></option>
      </select>

      <label for="partido">Partido</label>
      <select id="partido" name="partido">
        <option value="">Todos os partidos</option>
        <option th:each="opcaoPartido : ${partidos}"
                th:value="${opcaoPartido}"
                th:text="${opcaoPartido}"
                th:selected="${opcaoPartido == partidoSelecionado}"></option>
      </select>

      <label for="texto">Nome ou número</label>
      <input id="texto" name="texto" type="search" th:value="${textoBuscado}">

      <button type="submit">Filtrar</button>
      <a th:href="@{/}" class="limpar">Limpar</a>
    </form>

    <p th:text="${total + ' candidato(s) encontrado(s)'}"></p>

    <p th:if="${#lists.isEmpty(candidatos)}">Nenhum candidato encontrado.</p>

    <section th:unless="${#lists.isEmpty(candidatos)}">
      <div class="card" th:each="cand : ${candidatos}">
        <img th:src="${'/imagens/candidatos/' + cand.nomeArquivoFoto}"
           th:alt="${cand.nomeUrna}" class="foto-candidato">
        <h2 th:text="${cand.nomeUrna}">Nome de urna</h2>
        <p th:text="${cand.nomeCandidato}">Nome completo</p>
        <p>
         <span th:text="${cand.cargo}">Cargo</span>
          <span> | </span>
         <span th:text="${cand.siglaPartido}">Partido</span>
        </p>
        <p th:text="${'Número: ' + cand.nrCandidato}">Número</p>
        <p th:if="${cand.situacaoCandidatura != null and cand.situacaoCandidatura != '' and cand.situacaoCandidatura != '#NULO'}"
          th:text="${'Situação: ' + cand.situacaoCandidatura}">Situação</p>
        <p th:if="${cand.idade >= 0}"
          th:text="${'Idade: ' + cand.idade}">Idade</p>
        <p th:if="${cand.ocupacao != null and cand.ocupacao != '' and cand.ocupacao != '#NULO'}"
          th:text="${'Ocupação: ' + cand.ocupacao}">Ocupação</p>
        <p th:if="${cand.grauInstrucao != null and cand.grauInstrucao != '' and cand.grauInstrucao != '#NULO'}"
          th:text="${'Escolaridade: ' + cand.grauInstrucao}">Escolaridade</p>
      </div>
    </section>
  </main>
</body>
</html>
